plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brendigo.pay'
    compileSdk 36

    defaultConfig {
        applicationId 'com.brendigo.pay'
        minSdk 24
        targetSdk 36
        versionCode 85
        versionName '0.8.5'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
