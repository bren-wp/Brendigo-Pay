name: Publish Brendigo Pay sandbox release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-sandbox.yml'
      - 'scripts/package_release.py'
permissions:
  contents: write
jobs:
  sandbox-release:
    if: github.repository == 'bren-wp/Brendigo-Pay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, sodium, openssl, mbstring
          coverage: none
      - name: Offline regression checks
        run: bash tests/run-all.sh
      - name: Set up Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android API 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build installable debug APK and unsigned release AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease
      - name: Package Brendigo Pay SANDBOX
        run: |
          python3 scripts/package_release.py --output dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Brendigo-Pay-Android-0.8.6-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Brendigo-Pay-Android-0.8.6-unsigned.aab
          (cd dist && sha256sum Brendigo-Pay-Android-0.8.6-debug.apk Brendigo-Pay-Android-0.8.6-unsigned.aab >> SHA256SUMS.txt)
      - name: Publish or update sandbox prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 "VERSION = " scripts/package_release.py | cut -d"'" -f2)"
          TAG="v${VERSION}"
          FILES=(dist/*.zip dist/*.apk dist/*.aab dist/SHA256SUMS.txt)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${FILES[@]}" --target "${GITHUB_SHA}" --title "Brendigo Pay ${TAG} (SANDBOX)" --prerelease --notes "Development release only. No real payments. Brendigo Pay uses private JSON storage for its standalone platform and a WordPress/WooCommerce plugin. Visual pixel-perfect parity and production provider E2E testing are NOT certified."
          fi
          # GitHub may retain a previous stable-release flag when assets are replaced.
          # Enforce the SANDBOX / pre-release classification on every publish.
          gh release edit "${TAG}" --prerelease --title "Brendigo Pay ${TAG} (SANDBOX)"
