name: Capture actual Android UI screenshots
on:
  workflow_run:
    workflows: ["Publish Brendigo Pay sandbox release"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'bren-wp/Brendigo-Pay' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Install Android SDK emulator and platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Assemble native app
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Launch Android emulator and capture actual screen pixels
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n brendigo_ci -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd brendigo_ci \
            -no-window -no-audio -no-snapshot -gpu swiftshader_indirect \
            -no-boot-anim -camera-back none -camera-front none > /tmp/brendigo-emulator.log 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb start-server
          adb wait-for-device
          booted=false
          for i in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 3
          done
          [[ "$booted" == "true" ]] || { tail -60 /tmp/brendigo-emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n com.brendigo.pay.debug/com.brendigo.pay.MainActivity
          sleep 6
          mkdir -p screenshots
          adb exec-out screencap -p > screenshots/Brendigo-Pay-Android-0.8.10-login.png
          # Inspect the actual accessible text tree; scroll based on emulator resolution.
          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          def adb(*args):
              return subprocess.check_output(['adb',*args],text=True).strip()
          def nodes():
              adb('shell','uiautomator','dump','/sdcard/window.xml')
              subprocess.run(['adb','pull','/sdcard/window.xml','/tmp/brendigo-window.xml'],
                             stdout=subprocess.DEVNULL,check=True)
              return ET.parse('/tmp/brendigo-window.xml').getroot().iter('node')
          resolution=re.search(r'(\d+)x(\d+)',adb('shell','wm','size'))
          if not resolution:
              raise SystemExit('Unable to read emulator display dimensions')
          width,height=map(int,resolution.groups())
          for attempt in range(6):
              for node in nodes():
                  if 'Registrirajte se' in (node.attrib.get('text','')+' '+node.attrib.get('content-desc','')):
                      nums=[int(n) for n in re.findall(r'\d+',node.attrib['bounds'])]
                      x,y=(nums[0]+nums[2])//2,(nums[1]+nums[3])//2
                      subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                      break
              else:
                  subprocess.run(['adb','shell','input','swipe',str(width//2),
                                  str(height*3//4),str(width//2),str(height//3),'380'],check=True)
                  continue
              break
          else:
              raise SystemExit('Registration control not visible: screenshot not fabricated')
          found=False
          for node in nodes():
              if 'Otvorite korisnički račun' in node.attrib.get('text',''):
                  found=True
                  break
          if not found:
              raise SystemExit('Registration screen was not opened successfully')
          PY
          sleep 5
          adb exec-out screencap -p > screenshots/Brendigo-Pay-Android-0.8.10-registration.png
          test "$(stat -c%s screenshots/Brendigo-Pay-Android-0.8.10-login.png)" -gt 20000
          test "$(stat -c%s screenshots/Brendigo-Pay-Android-0.8.10-registration.png)" -gt 20000
          file screenshots/*.png
          sha256sum screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: brendigo-android-real-screenshots-0.8.10
          path: screenshots/*.png
          retention-days: 30
      - name: Upload verified emulator screenshots to existing sandbox release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.8.10 screenshots/*.png --clobber
